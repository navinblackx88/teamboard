# Single entry point for the local stack: serves the SPA and proxies the API (same origin, no CORS).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 30m;            # attachments up to MAX_UPLOAD_MB (25 MB) plus multipart overhead
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # REST API, Swagger docs and signed file downloads
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health { proxy_pass http://api:4000; }

  # Socket.IO real-time (WebSocket upgrade)
  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # SPA: every other route serves index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
