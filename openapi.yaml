openapi: 3.0.3
info:
  title: TeamBoard API
  version: 1.0.0
  description: |
    REST API for TeamBoard, a project-management app (Jira/Trello lite).

    **Auth.** Send `Authorization: Bearer <accessToken>`. Access tokens last 15 minutes;
    exchange the refresh token at `POST /auth/refresh` (refresh tokens rotate on every use).

    **Roles** (per workspace): `admin` › `project_manager` › `developer` › `viewer`.
    | Capability | Admin | PM | Developer | Viewer |
    |---|:-:|:-:|:-:|:-:|
    | Read everything they can see | ✓ | ✓ | ✓ | ✓ |
    | Create/edit/move tasks, comment, upload | ✓ | ✓ | ✓ | |
    | Delete any task, moderate comments/files | ✓ | ✓ | own only | |
    | Projects, sprints, labels, project members | ✓ | ✓ | | |
    | Workspace settings, members, roles, invites | ✓ | | | |

    Admins and PMs see every project in a workspace; developers and viewers see projects they are members of.
    Resources you cannot see return **404**; resources you can see but not change return **403**.

    **Pagination.** Lists that scroll infinitely use keyset cursors (`limit`, `cursor` → `nextCursor`).
    The activity log uses page numbers (`page`, `pageSize` → `total`, `totalPages`).

    **Real-time.** Connect with Socket.IO to the API origin (path `/socket.io`) with `auth: { token: accessToken }`.
    Emit `workspace:join` / `project:join` (`projectId`) with an ack callback. Server events:
    `task.created|updated|moved|deleted`, `comment.created|updated|deleted`, `attachment.created|deleted`,
    `sprint.created|updated|deleted`, `project.updated|deleted`, `label.changed`, `member.changed`,
    `activity.created`, `notification.created`, `presence.changed`. Every payload includes `actorId`.
servers:
  - url: http://localhost:4000/api/v1
    description: Local
security:
  - bearerAuth: []
tags:
  - { name: Auth, description: "Signup, login, tokens, Google OAuth2, profile" }
  - { name: Workspaces, description: "Workspaces, members, roles and invitations" }
  - { name: Projects, description: "Projects, project members and labels" }
  - { name: Tasks, description: "Tasks, subtasks, board and drag-and-drop" }
  - { name: Sprints, description: "Sprint lifecycle, planning, burndown and velocity" }
  - { name: Comments, description: "Threaded comments with @mentions" }
  - { name: Files, description: "Task attachments (S3 / GCS / MinIO / local)" }
  - { name: Notifications, description: "In-app notifications" }
  - { name: Activity, description: "Workspace activity log" }
  - { name: Dashboard }
  - { name: Platform, description: "Runtime config and real-time channel authorization" }

paths:
  # ─── Auth ──────────────────────────────────────────────────────────────────
  /auth/signup:
    post:
      tags: [Auth]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                inviteToken: { type: string, description: Accept a workspace invitation as part of signup }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                inviteToken: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair
      description: The submitted refresh token is revoked; reuse fails with 401.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } }
      responses:
        "204": { description: Revoked }
  /auth/providers:
    get:
      tags: [Auth]
      summary: Which sign-in providers are enabled
      security: []
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { google: { type: boolean } } } } }
  /auth/google:
    get:
      tags: [Auth]
      summary: Start Google OAuth2 (redirect flow)
      description: Redirects to Google. After consent Google calls `/auth/google/callback`, which redirects to `{APP_URL}/auth/callback#access=…&refresh=…`.
      security: []
      parameters:
        - { name: inviteToken, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to Google }
        "501": { description: Google sign-in not configured, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      tags: [Auth]
      summary: Sign in with a Google ID token
      description: For Google Identity Services / One Tap. New users are created; existing email accounts are linked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
                inviteToken: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { description: Google sign-in not configured }
  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth2 redirect URI
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: Redirect to the frontend with tokens (or `#error=`) in the URL fragment }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user and their workspaces
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/Me" }
                  workspaces:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        slug: { type: string }
                        role: { $ref: "#/components/schemas/Role" }
    patch:
      tags: [Auth]
      summary: Update profile, notification preference or password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                avatarUrl: { type: string, format: uri, nullable: true }
                emailNotifications: { type: boolean }
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { user: { $ref: "#/components/schemas/Me" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ─── Workspaces ────────────────────────────────────────────────────────────
  /workspaces:
    get:
      tags: [Workspaces]
      summary: List my workspaces
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/WorkspaceSummary"
                        - type: object
                          properties: { memberCount: { type: integer } }
    post:
      tags: [Workspaces]
      summary: Create a workspace (creator becomes admin)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 120 } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } } }
  /workspaces/{wid}:
    parameters: [{ $ref: "#/components/parameters/wid" }]
    get:
      tags: [Workspaces]
      summary: Workspace details with my role and permissions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Workspace"
                  - type: object
                    properties:
                      permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Workspaces]
      summary: Update name or settings (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                settings: { $ref: "#/components/schemas/WorkspaceSettings" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Workspaces]
      summary: Delete the workspace (owner only)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
  /workspaces/{wid}/members:
    parameters: [{ $ref: "#/components/parameters/wid" }]
    get:
      tags: [Workspaces]
      summary: List members (also used for @mention autocomplete)
      parameters:
        - { name: q, in: query, description: Filter by name or email, schema: { type: string } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Member" } } } } } }
  /workspaces/{wid}/members/{uid}:
    parameters: [{ $ref: "#/components/parameters/wid" }, { $ref: "#/components/parameters/uid" }]
    patch:
      tags: [Workspaces]
      summary: Change a member's role (admin)
      description: The owner must stay admin, and a workspace always keeps at least one admin.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { $ref: "#/components/schemas/Role" } } } } }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Workspaces]
      summary: Remove a member (admin) or leave (self)
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
  /workspaces/{wid}/invitations:
    parameters: [{ $ref: "#/components/parameters/wid" }]
    get:
      tags: [Workspaces]
      summary: Pending invitations (admin)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Invitation" } } } } } } }
    post:
      tags: [Workspaces]
      summary: Invite someone by email (admin)
      description: Emails a link valid for 7 days. You cannot invite a role higher than your own, and `allowedEmailDomains` is enforced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Invitation"
                  - type: object
                    properties: { inviteUrl: { type: string, format: uri } }
        "409": { $ref: "#/components/responses/Conflict" }
  /workspaces/{wid}/invitations/{iid}:
    parameters:
      - { $ref: "#/components/parameters/wid" }
      - { name: iid, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Workspaces]
      summary: Revoke an invitation (admin)
      responses:
        "204": { description: Revoked }
  /invitations/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Workspaces]
      summary: Preview an invitation (public)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaceName: { type: string }
                  invitedByName: { type: string }
                  email: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
                  expiresAt: { type: string, format: date-time }
                  status: { type: string, enum: [pending, accepted, expired] }
        "404": { $ref: "#/components/responses/NotFound" }
  /invitations/{token}/accept:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Workspaces]
      summary: Accept an invitation (signed-in email must match)
      responses:
        "200": { description: Joined, content: { application/json: { schema: { type: object, properties: { workspaceId: { type: string, format: uuid } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410": { description: Expired or already used }

  # ─── Projects ──────────────────────────────────────────────────────────────
  /workspaces/{wid}/projects:
    parameters: [{ $ref: "#/components/parameters/wid" }]
    get:
      tags: [Projects]
      summary: Projects I can see, with task stats
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ProjectListItem" } } } } } } }
    post:
      tags: [Projects]
      summary: Create a project (admin, PM)
      description: The creator and lead are added as members; default labels are created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, key]
              properties:
                name: { type: string }
                key: { type: string, pattern: "^[A-Z][A-Z0-9]{1,9}$", example: WEB }
                description: { type: string }
                color: { type: string, example: "#6366f1" }
                leadId: { type: string, format: uuid }
                memberIds: { type: array, items: { type: string, format: uuid } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{pid}:
    parameters: [{ $ref: "#/components/parameters/pid" }]
    get:
      tags: [Projects]
      summary: Project with members, labels, active sprint and my permissions
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Projects]
      summary: Update a project / archive it (admin, PM)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
                status: { type: string, enum: [active, archived] }
                color: { type: string }
                leadId: { type: string, format: uuid, nullable: true }
                settings: { $ref: "#/components/schemas/ProjectSettings" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
    delete:
      tags: [Projects]
      summary: Delete a project and all its data (admin)
      responses:
        "204": { description: Deleted }
  /projects/{pid}/members:
    parameters: [{ $ref: "#/components/parameters/pid" }]
    get:
      tags: [Projects]
      summary: Project members
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Member" } } } } } } }
    post:
      tags: [Projects]
      summary: Add workspace members to the project (admin, PM)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [userIds], properties: { userIds: { type: array, items: { type: string, format: uuid } } } } } }
      responses:
        "204": { description: Added }
  /projects/{pid}/members/{uid}:
    parameters: [{ $ref: "#/components/parameters/pid" }, { $ref: "#/components/parameters/uid" }]
    delete:
      tags: [Projects]
      summary: Remove a project member (admin, PM)
      responses:
        "204": { description: Removed }
  /projects/{pid}/labels:
    parameters: [{ $ref: "#/components/parameters/pid" }]
    get:
      tags: [Projects]
      summary: Project labels
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Label" } } } } } } }
    post:
      tags: [Projects]
      summary: Create a label (admin, PM)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LabelInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Label" } } } }
  /labels/{lid}:
    parameters: [{ name: lid, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Projects]
      summary: Rename or recolour a label
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/LabelInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Label" } } } }
    delete:
      tags: [Projects]
      summary: Delete a label
      responses:
        "204": { description: Deleted }

  # ─── Tasks ─────────────────────────────────────────────────────────────────
  /projects/{pid}/tasks:
    parameters: [{ $ref: "#/components/parameters/pid" }]
    get:
      tags: [Tasks]
      summary: List tasks (filterable, cursor-paginated for infinite scroll)
      parameters:
        - { name: status, in: query, description: Comma-separated, schema: { type: string, example: "backlog,in_progress" } }
        - { name: priority, in: query, description: Comma-separated, schema: { type: string } }
        - { name: labelId, in: query, description: Comma-separated label ids (match any), schema: { type: string } }
        - { name: assigneeId, in: query, description: "User id, `me`, or `unassigned`", schema: { type: string } }
        - { name: sprintId, in: query, description: "Sprint id, `active`, or `backlog` (no sprint)", schema: { type: string } }
        - { name: parentId, in: query, description: List subtasks of a task, schema: { type: string, format: uuid } }
        - { name: includeSubtasks, in: query, schema: { type: boolean, default: false } }
        - { name: dueBefore, in: query, schema: { type: string, format: date-time } }
        - { name: q, in: query, description: "Title search, or a task key like `WEB-12`", schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [position, created, updated, due], default: position } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TaskPage" } } } }
    post:
      tags: [Tasks]
      summary: Create a task or subtask (admin, PM, developer)
      description: Assignees are notified (in-app + email). Developers/viewers who are assigned are added to the project automatically.
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/TaskInput" }, { required: [title] }] } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/{pid}/tasks/board:
    parameters: [{ $ref: "#/components/parameters/pid" }]
    get:
      tags: [Tasks]
      summary: Kanban board, with top-level tasks grouped by column
      parameters:
        - { name: sprintId, in: query, description: "`all` (default; hides tasks from completed sprints), `active`, or a sprint id", schema: { type: string } }
        - { name: assigneeId, in: query, schema: { type: string, format: uuid } }
        - { name: labelId, in: query, schema: { type: string, format: uuid } }
        - { name: priority, in: query, schema: { $ref: "#/components/schemas/Priority" } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sprintId: { type: string, format: uuid, nullable: true }
                  columns:
                    type: object
                    properties:
                      backlog: { type: array, items: { $ref: "#/components/schemas/Task" } }
                      in_progress: { type: array, items: { $ref: "#/components/schemas/Task" } }
                      review: { type: array, items: { $ref: "#/components/schemas/Task" } }
                      done: { type: array, items: { $ref: "#/components/schemas/Task" } }
                  wipLimits: { type: object, additionalProperties: { type: integer } }
  /me/tasks:
    get:
      tags: [Tasks]
      summary: Tasks assigned to me in a workspace (infinite scroll)
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [position, created, updated, due], default: due } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TaskPage" } } } }
  /tasks/{tid}:
    parameters: [{ $ref: "#/components/parameters/tid" }]
    get:
      tags: [Tasks]
      summary: Task detail with subtasks, parent, sprint and reporter
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tasks]
      summary: Update fields
      description: "`assigneeIds` and `labelIds` replace the existing sets. Newly added assignees are notified. Changing `dueDate` re-arms the deadline reminder."
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
    delete:
      tags: [Tasks]
      summary: Delete (PM/admin, or the reporter)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tasks/{tid}/move:
    parameters: [{ $ref: "#/components/parameters/tid" }]
    post:
      tags: [Tasks]
      summary: Drag-and-drop move to a column and position
      description: Places the task between `afterId` (card above) and `beforeId` (card below) in `status`. Omit both to append to the column.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/TaskStatus" }
                afterId: { type: string, format: uuid, nullable: true }
                beforeId: { type: string, format: uuid, nullable: true }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
  /tasks/{tid}/subtasks:
    parameters: [{ $ref: "#/components/parameters/tid" }]
    get:
      tags: [Tasks]
      summary: Subtasks of a task
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Task" } } } } } } }

  # ─── Sprints ───────────────────────────────────────────────────────────────
  /projects/{pid}/sprints:
    parameters: [{ $ref: "#/components/parameters/pid" }]
    get:
      tags: [Sprints]
      summary: Sprints (active, then planned, then completed)
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/SprintStatus" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Sprint" } } } } } } }
    post:
      tags: [Sprints]
      summary: Create a planned sprint (admin, PM)
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/SprintInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Sprint" } } } }
  /projects/{pid}/sprints/velocity:
    parameters: [{ $ref: "#/components/parameters/pid" }]
    get:
      tags: [Sprints]
      summary: Velocity, committed vs completed points for recent completed sprints
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 6, maximum: 24 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  averageVelocity: { type: number }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        committed: { type: integer }
                        completed: { type: integer }
                        startDate: { type: string, format: date-time, nullable: true }
                        completedAt: { type: string, format: date-time }
  /sprints/{sid}:
    parameters: [{ $ref: "#/components/parameters/sid" }]
    get:
      tags: [Sprints]
      summary: Sprint with stats
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Sprint" } } } }
    patch:
      tags: [Sprints]
      summary: Edit name, goal or dates (not completed sprints)
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/SprintInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Sprint" } } } }
    delete:
      tags: [Sprints]
      summary: Delete a planned sprint (its tasks return to the backlog)
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
  /sprints/{sid}/start:
    parameters: [{ $ref: "#/components/parameters/sid" }]
    post:
      tags: [Sprints]
      summary: Start a sprint
      description: Freezes `committedPoints`. Only one sprint per project can be active (409 otherwise). Project members are notified.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startDate: { type: string, format: date-time }
                endDate: { type: string, format: date-time }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Sprint" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /sprints/{sid}/complete:
    parameters: [{ $ref: "#/components/parameters/sid" }]
    post:
      tags: [Sprints]
      summary: Complete the active sprint
      description: Freezes `completedPoints` (which feed velocity) and moves unfinished tasks to the backlog or a planned sprint.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                moveIncompleteTo: { type: string, description: "`backlog` or a planned sprint id", default: backlog }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Sprint"
                  - type: object
                    properties: { movedCount: { type: integer } }
  /sprints/{sid}/tasks:
    parameters: [{ $ref: "#/components/parameters/sid" }]
    post:
      tags: [Sprints]
      summary: Add tasks to a sprint (sprint planning)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [taskIds], properties: { taskIds: { type: array, items: { type: string, format: uuid } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Sprint" } } } }
  /sprints/{sid}/tasks/{tid}:
    parameters: [{ $ref: "#/components/parameters/sid" }, { $ref: "#/components/parameters/tid" }]
    delete:
      tags: [Sprints]
      summary: Move a task from the sprint back to the backlog
      responses:
        "204": { description: Removed }
  /sprints/{sid}/burndown:
    parameters: [{ $ref: "#/components/parameters/sid" }]
    get:
      tags: [Sprints]
      summary: Burndown series
      description: One point per day. `ideal` falls linearly from committed points; `remaining` is current scope minus points completed by the end of that day (null for future days).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sprint: { $ref: "#/components/schemas/Sprint" }
                  committedPoints: { type: integer }
                  scopePoints: { type: integer }
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        ideal: { type: number }
                        remaining: { type: number, nullable: true }
                        completed: { type: number, nullable: true }

  # ─── Comments ──────────────────────────────────────────────────────────────
  /tasks/{tid}/comments:
    parameters: [{ $ref: "#/components/parameters/tid" }]
    get:
      tags: [Comments]
      summary: Threaded comments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/Comment" } }
    post:
      tags: [Comments]
      summary: Comment or reply
      description: |
        Mention people with `@[Display Name](user-uuid)`. Mentioned workspace members get a `mentioned`
        notification; assignees, the reporter and earlier commenters get `comment_added`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 20000, example: "Looks good @[Priya Shah](6f1c…)!" }
                parentId: { type: string, format: uuid }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
  /comments/{cid}:
    parameters: [{ name: cid, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Comments]
      summary: Edit my comment
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Comments]
      summary: Delete (author or moderator; soft delete keeps replies)
      responses:
        "204": { description: Deleted }

  # ─── Files ─────────────────────────────────────────────────────────────────
  /tasks/{tid}/attachments:
    parameters: [{ $ref: "#/components/parameters/tid" }]
    get:
      tags: [Files]
      summary: Attachments on a task
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Attachment" } } } } } } }
    post:
      tags: [Files]
      summary: Upload up to 10 files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files: { type: array, items: { type: string, format: binary } }
      responses:
        "201": { description: Uploaded, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Attachment" } } } } } } }
        "413": { description: File too large }
  /config:
    get:
      tags: [Platform]
      summary: Runtime config for clients (upload size limit)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploads: { type: object, properties: { maxMb: { type: number } } }
  /attachments/{aid}/url:
    parameters: [{ $ref: "#/components/parameters/aid" }]
    get:
      tags: [Files]
      summary: Short-lived download URL (presigned S3/GCS URL or signed API link)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { url: { type: string, format: uri }, expiresInSeconds: { type: integer } } } } } }
  /attachments/{aid}/download:
    parameters: [{ $ref: "#/components/parameters/aid" }]
    get:
      tags: [Files]
      summary: Download (302 to object storage, or streamed)
      responses:
        "200": { description: File contents, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "302": { description: Redirect to a presigned URL }
  /attachments/{aid}:
    parameters: [{ $ref: "#/components/parameters/aid" }]
    delete:
      tags: [Files]
      summary: Delete (uploader or moderator)
      responses:
        "204": { description: Deleted }
  /files/{aid}:
    parameters: [{ $ref: "#/components/parameters/aid" }]
    get:
      tags: [Files]
      summary: Signed download link target (local storage driver)
      security: []
      parameters:
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: File contents, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─── Notifications ─────────────────────────────────────────────────────────
  /notifications:
    get:
      tags: [Notifications]
      summary: My notifications (newest first)
      parameters:
        - { name: unreadOnly, in: query, schema: { type: boolean } }
        - { name: workspaceId, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  nextCursor: { type: string, nullable: true }
  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Unread count
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { count: { type: integer } } } } } }
  /notifications/{nid}/read:
    parameters: [{ name: nid, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Notifications]
      summary: Mark one as read
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Notification" } } } }
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all as read
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { updated: { type: integer } } } } } }

  # ─── Activity & dashboard ──────────────────────────────────────────────────
  /workspaces/{wid}/activity:
    parameters: [{ $ref: "#/components/parameters/wid" }]
    get:
      tags: [Activity]
      summary: Paginated activity log with filters
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: taskId, in: query, schema: { type: string, format: uuid } }
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: entityType, in: query, schema: { type: string, enum: [workspace, project, task, sprint, comment, attachment, member, label] } }
        - { name: action, in: query, description: "Exact (`task.created`) or prefix ending in a dot (`sprint.`)", schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Activity" } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  totalPages: { type: integer }
  /workspaces/{wid}/dashboard:
    parameters: [{ $ref: "#/components/parameters/wid" }]
    get:
      tags: [Dashboard]
      summary: Projects overview, my tasks, sprint progress and upcoming deadlines
      description: Cached in Redis per user and invalidated on any workspace activity.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    wid: { name: wid, in: path, required: true, description: Workspace id, schema: { type: string, format: uuid } }
    pid: { name: pid, in: path, required: true, description: Project id, schema: { type: string, format: uuid } }
    tid: { name: tid, in: path, required: true, description: Task id, schema: { type: string, format: uuid } }
    sid: { name: sid, in: path, required: true, description: Sprint id, schema: { type: string, format: uuid } }
    uid: { name: uid, in: path, required: true, description: User id, schema: { type: string, format: uuid } }
    aid: { name: aid, in: path, required: true, description: Attachment id, schema: { type: string, format: uuid } }
    limit: { name: limit, in: query, schema: { type: integer, default: 30, minimum: 1, maximum: 100 } }
    cursor: { name: cursor, in: query, description: "`nextCursor` from the previous page", schema: { type: string } }
  responses:
    BadRequest: { description: Validation failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Missing or invalid credentials, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Your role does not allow this, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Not found or not visible to you, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Conflict: { description: Conflicts with existing state, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: bad_request }
            message: { type: string }
            details: { type: array, items: { type: object, properties: { path: { type: string }, message: { type: string } } } }
    Role: { type: string, enum: [admin, project_manager, developer, viewer] }
    Permission:
      type: string
      enum: [workspace:update, workspace:delete, members:manage, invites:manage, project:create, project:update, project:delete, project:members, sprint:manage, label:manage, task:create, task:update, task:delete, comment:create, comment:moderate, file:upload, file:moderate, read]
    TaskStatus: { type: string, enum: [backlog, in_progress, review, done] }
    Priority: { type: string, enum: [low, medium, high, urgent] }
    SprintStatus: { type: string, enum: [planned, active, completed] }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: string, nullable: true }
    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            emailNotifications: { type: boolean }
            hasPassword: { type: boolean }
            googleLinked: { type: boolean }
            createdAt: { type: string, format: date-time }
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
    RefreshRequest: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          properties:
            user: { $ref: "#/components/schemas/Me" }
            joinedWorkspaceId: { type: string, format: uuid, description: Set when an inviteToken was accepted }
    WorkspaceSettings:
      type: object
      properties:
        defaultRole: { type: string, enum: [developer, viewer] }
        allowedEmailDomains: { type: array, items: { type: string, example: acme.com } }
        timezone: { type: string, example: Asia/Kolkata }
    WorkspaceSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    Workspace:
      allOf:
        - $ref: "#/components/schemas/WorkspaceSummary"
        - type: object
          properties:
            ownerId: { type: string, format: uuid }
            settings: { $ref: "#/components/schemas/WorkspaceSettings" }
            createdAt: { type: string, format: date-time }
    Member:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            role: { $ref: "#/components/schemas/Role" }
            joinedAt: { type: string, format: date-time }
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        invitedBy: { type: object, properties: { id: { type: string }, name: { type: string } } }
    ProjectSettings:
      type: object
      properties:
        defaultSprintLengthDays: { type: integer, minimum: 1, maximum: 60 }
        wipLimits: { type: object, additionalProperties: { type: integer }, example: { in_progress: 5, review: 3 } }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        key: { type: string, example: WEB }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, archived] }
        leadId: { type: string, format: uuid, nullable: true }
        color: { type: string }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectListItem:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            memberCount: { type: integer }
            stats: { type: object, properties: { total: { type: integer }, done: { type: integer }, inProgress: { type: integer }, review: { type: integer }, backlog: { type: integer } } }
            activeSprint: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string }, endDate: { type: string, nullable: true } } }
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            members: { type: array, items: { $ref: "#/components/schemas/User" } }
            labels: { type: array, items: { $ref: "#/components/schemas/Label" } }
            activeSprint: { allOf: [{ $ref: "#/components/schemas/SprintBase" }], nullable: true }
            role: { $ref: "#/components/schemas/Role" }
            permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
    Label:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
    LabelInput:
      type: object
      properties:
        name: { type: string, maxLength: 40 }
        color: { type: string, example: "#ef4444" }
    TaskInput:
      type: object
      properties:
        title: { type: string, maxLength: 300 }
        description: { type: string, nullable: true, description: Markdown }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        storyPoints: { type: integer, minimum: 0, maximum: 100, nullable: true }
        sprintId: { type: string, format: uuid, nullable: true }
        parentId: { type: string, format: uuid, nullable: true, description: Makes this a subtask (one level deep) }
        assigneeIds: { type: array, items: { type: string, format: uuid } }
        labelIds: { type: array, items: { type: string, format: uuid } }
        dueDate: { type: string, format: date-time, nullable: true }
    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: WEB-42 }
        number: { type: integer }
        projectId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        storyPoints: { type: integer, nullable: true }
        position: { type: number }
        parentId: { type: string, format: uuid, nullable: true }
        sprintId: { type: string, format: uuid, nullable: true }
        reporterId: { type: string, format: uuid, nullable: true }
        dueDate: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        assignees: { type: array, items: { $ref: "#/components/schemas/User" } }
        labels: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, color: { type: string } } } }
        subtaskCount: { type: integer }
        subtaskDoneCount: { type: integer }
        commentCount: { type: integer }
        attachmentCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          properties:
            subtasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
            reporter: { allOf: [{ $ref: "#/components/schemas/User" }], nullable: true }
            parent: { type: object, nullable: true, properties: { id: { type: string }, key: { type: string }, title: { type: string } } }
            sprint: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string }, status: { $ref: "#/components/schemas/SprintStatus" } } }
            project: { type: object, properties: { id: { type: string }, name: { type: string }, key: { type: string }, workspaceId: { type: string } } }
            canEdit: { type: boolean }
    TaskPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Task" } }
        nextCursor: { type: string, nullable: true }
    SprintInput:
      type: object
      properties:
        name: { type: string }
        goal: { type: string, nullable: true }
        startDate: { type: string, format: date-time, nullable: true }
        endDate: { type: string, format: date-time, nullable: true }
    SprintBase:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        goal: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/SprintStatus" }
        startDate: { type: string, format: date-time, nullable: true }
        endDate: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        committedPoints: { type: integer, nullable: true }
        completedPoints: { type: integer, nullable: true }
    Sprint:
      allOf:
        - $ref: "#/components/schemas/SprintBase"
        - type: object
          properties:
            stats: { type: object, properties: { totalTasks: { type: integer }, doneTasks: { type: integer }, totalPoints: { type: integer }, donePoints: { type: integer } } }
    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        body: { type: string, description: Empty when deleted }
        mentionedUserIds: { type: array, items: { type: string, format: uuid } }
        author: { allOf: [{ $ref: "#/components/schemas/User" }], nullable: true }
        editedAt: { type: string, format: date-time, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        replies: { type: array, items: { $ref: "#/components/schemas/Comment" } }
    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        filename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        uploader: { allOf: [{ $ref: "#/components/schemas/User" }], nullable: true }
        createdAt: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [task_assigned, comment_added, mentioned, deadline_approaching, invited, sprint_started, sprint_completed] }
        title: { type: string }
        body: { type: string, nullable: true }
        link: { type: string, nullable: true, description: App-relative path }
        workspaceId: { type: string, format: uuid, nullable: true }
        data: { type: object }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    Activity:
      type: object
      properties:
        id: { type: string, format: uuid }
        action: { type: string, example: task.status_changed }
        entityType: { type: string }
        entityId: { type: string, format: uuid, nullable: true }
        summary: { type: string, example: moved WEB-12 from In Progress to Review }
        metadata: { type: object }
        actor: { allOf: [{ $ref: "#/components/schemas/User" }], nullable: true }
        project: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string }, key: { type: string }, color: { type: string } } }
        taskId: { type: string, format: uuid, nullable: true }
        taskTitle: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Dashboard:
      type: object
      properties:
        projects:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              key: { type: string }
              color: { type: string }
              total: { type: integer }
              done: { type: integer }
              overdue: { type: integer }
              progress: { type: integer, description: Percent done }
              activeSprint: { type: string, nullable: true }
        myTasks:
          type: object
          properties:
            total: { type: integer }
            overdue: { type: integer }
            byStatus: { type: object, additionalProperties: { type: integer } }
            items: { type: array, items: { $ref: "#/components/schemas/Task" } }
        activeSprints:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/SprintBase"
              - type: object
                properties:
                  project: { type: object, properties: { id: { type: string }, name: { type: string }, key: { type: string }, color: { type: string } } }
                  totalTasks: { type: integer }
                  doneTasks: { type: integer }
                  totalPoints: { type: integer }
                  donePoints: { type: integer }
                  daysLeft: { type: integer, nullable: true }
        upcomingDeadlines:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Task"
              - type: object
                properties: { overdue: { type: boolean } }
